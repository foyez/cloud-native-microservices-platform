services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: eks_micro
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  user-service:
    build:
      context: ../../microservices/user-service
      # target: prod # Use the prod stage
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      - SERVICE=user
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=testpass
      - DB_NAME=eks_micro
      - SSLMODE=disable
      - PORT=8080
      - JWT_SECRET=your_jwt_secret_here
      
    depends_on:
      postgresql:
        condition: service_healthy

  product-service:
      build:
        context: ../../microservices/product-service
      container_name: product-service
      ports:
        - "8081:8081"
      environment:
        - SERVICE=product
        - DB_HOST=postgresql
        - DB_PORT=5432
        - DB_USER=postgres
        - DB_PASSWORD=testpass
        - DB_NAME=eks_micro
        - SSLMODE=disable
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - PORT=8081
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy

  order-service:
      build:
        context: ../../microservices/order-service
      container_name: order-service
      ports:
        - "8082:8082"
      environment:
        - SERVICE=order
        - DB_HOST=postgresql
        - DB_PORT=5432
        - DB_USER=postgres
        - DB_PASSWORD=testpass
        - DB_NAME=eks_micro
        - SSLMODE=disable
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - PORT=8082
        - PRODUCT_SERVICE_URL=http://product-service:8081
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy

  api-gateway:
    build:
      context: ../../microservices/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8080
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - JWT_SECRET=your_jwt_secret_here
    depends_on:
      - user-service
      - product-service
      - order-service

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgresql_data:
  redis_data: